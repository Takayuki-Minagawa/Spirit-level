<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spirit Level - 水平器</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="diagnostics.css">
</head>
<body>
  <main class="container">
    <h1>Spirit Level</h1>
    <p class="subtitle">Smartphone Spirit Level / 水平器</p>

    <section class="card" aria-labelledby="aboutTitle">
      <h2 id="aboutTitle">About</h2>
      <p>
        スマートフォンの加速度センサーを使った水平器Webアプリです。
        任意の面を基準にした較正機能、水平時のフィードバック機能を搭載しています。
      </p>
    </section>

    <section class="card" aria-labelledby="termsTitle">
      <h2 id="termsTitle">Terms &amp; Privacy</h2>
      <p>ご利用前に利用規約とプライバシーポリシーをご確認ください。</p>
      <nav class="legal-links" aria-label="法的情報">
        <a href="legal/terms.html">利用規約</a>
        <a href="legal/privacy.html">プライバシーポリシー</a>
      </nav>
      <div class="consent-row">
        <input type="checkbox" id="consentCheck">
        <label for="consentCheck">利用規約・プライバシーポリシーに同意します</label>
      </div>
    </section>

    <button class="btn btn-primary" id="startCheck" type="button" disabled>
      センサーチェック開始
    </button>

    <section class="card" id="diagnostics" aria-labelledby="diagnosticsTitle" hidden>
      <h2 id="diagnosticsTitle">Sensor Diagnostics</h2>
      <div id="checkList"></div>
      <div id="resultBox" aria-live="polite"></div>
    </section>

    <a class="btn btn-success" id="goApp" href="app/index.html" hidden>
      水平器画面へ進む
    </a>
  </main>

  <script src="diagnostics.js"></script>
</body>
</html>
